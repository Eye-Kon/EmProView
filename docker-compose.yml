# EmProView air-gapped enterprise stack: one `docker compose up -d`.
#
#   app    Node server + in-process background workers (NASR updater,
#          batch queue worker)
#   mongo  multi-cycle nav_data ground truth, procedures, batch queue
#   llm    local Ollama inference — chart-text extraction never leaves
#          this network
#
# Secrets: ADMIN_API_KEY must be provided by the operator (shell export or
# an .env file next to this compose file). Startup refuses to run without it.
#
# Air-gap note: the llm service pulls its model from the Ollama registry on
# FIRST start only (the model persists in the ollama_models volume). For a
# truly offline site, run the first start on a connected staging host and
# ship the populated volume — or `docker save` a committed image — so no
# network is ever needed on-site.
#
# NASR sideloading: drop the FAA 28-day CSV zip into ./nasr_dropzone as
# nasr.zip. The updater ingests it and renames it *.processed. Because
# NASR_LOCAL_ZIP_PATH is set, the app never attempts the FAA download.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Cap app RAM so a runaway loop OOMs the container instead of the host.
    mem_limit: 1g
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      MONGODB_URI: mongodb://mongo:27017/emproview
      LLM_BASE_URL: http://llm:11434/v1
      LLM_MODEL_NAME: llama3:8b-instruct-q4_K_M
      # Stage 1 of the dual-pass /api/analyze pipeline: chart image → raw
      # procedure text via a vision-capable local model. qwen2.5vl replaces
      # llama3.2-vision: its mllama architecture cannot load on current
      # Ollama releases (support was dropped with the engine migration).
      LLM_VISION_MODEL_NAME: qwen2.5vl:7b
      ENABLE_OCR: "false"
      # Pulled from the .env file next to this compose file; defaults to
      # "false" so production stacks never seed demo procedures by accident.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Injected at runtime from the host environment or the .env file next
      # to this compose file — never baked into the image at build time.
      # The :? guard makes compose refuse to start if the key is missing.
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set in the deployment environment}
      NASR_LOCAL_ZIP_PATH: /app/dropzone/nasr.zip
      BATCH_CONCURRENCY: "1"
      ANALYZE_TRACE_PATH: /app/logs/analyze-trace.log
    volumes:
      - ./nasr_dropzone:/app/dropzone
      # Survives container death / host thrash — read logs/analyze-trace.log
      - ./logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      llm:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongo:
    image: mongo:latest
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  llm:
    image: ollama/ollama
    restart: unless-stopped
    # 12g accommodates the dual-pass pair (llama3 8B q4 text + qwen2.5vl 7B
    # vision) when Ollama spills past VRAM or falls back to CPU inference.
    # (Model weights live in GPU VRAM once the NVIDIA reservation below is
    # active, so this cap only bounds the host-side process memory.)
    mem_limit: 12g
    memswap_limit: 12g
    # GPU passthrough: reserve one NVIDIA GPU so inference runs on hardware
    # instead of CPU (fixes the llama-server EOF crashes and slow evals).
    # Requires the NVIDIA container runtime on the Docker host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # Keep the model resident between requests: cold-loading weights per
      # request is where most extraction latency (and flakiness) came from.
      - OLLAMA_KEEP_ALIVE=24h
      # Single-request serving matches the app's one-at-a-time extraction
      # pipeline and avoids VRAM contention from parallel slots.
      - OLLAMA_NUM_PARALLEL=1
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Start the server, ensure both dual-pass models are present (no-op once
    # the volume holds them), then keep serving.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        SERVER_PID=$$!
        sleep 5
        ollama pull llama3:8b-instruct-q4_K_M
        ollama pull qwen2.5vl:7b
        wait $$SERVER_PID

volumes:
  mongo_data:
  ollama_models:
